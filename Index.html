<script>
async function unshort() {
    const url = document.getElementById("urlInput").value;
    const output = document.getElementById("output");

    if(!url){
        output.innerHTML = "Please enter URL";
        output.style.display = "block";
        return;
    }

    try {
        const response = await fetch('https://protein-today-readily-prompt.trycloudflare.com/unshort?url=' + encodeURIComponent(url));
        const data = await response.json();
        output.style.display = "block";
        output.innerHTML = 'Final URL: <a href="' + data.final + '" target="_blank">' + data.final + '</a>';
    } catch (err) {
        output.innerHTML = "Error resolving the URL!";
        output.style.display = "block";
    }
}
</script>
